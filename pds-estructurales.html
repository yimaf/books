<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Documento</title>
    <style>
        /* Hace que el documento ocupe exactamente toda la ventana del navegador */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #525659; /* Color gris estándar de lectores de PDF */
            font-family: Arial, sans-serif;
        }
        object {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Estilo para el mensaje de respaldo por si falla la carga nativa */
        .fallback {
            color: white;
            text-align: center;
            padding: 40px;
        }
        .btn-download {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #24292e;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Cambia "./tu-archivo.pdf" por el nombre exacto de tu documento en GitHub -->
    <object data="Libro%20Patrones%20Dise%C3%B1o%20Estructurales%20GitHub.pdf" type="application/pdf">
        <!-- Este mensaje solo aparecerá si el navegador no puede renderizar el PDF -->
        <div class="fallback">
            <p>Este navegador no soporta la visualización directa de PDFs.</p>
            <a class="btn-download" href="Libro%20Patrones%20Dise%C3%B1o%20Estructurales%20GitHub.pdf" download>Descargar Documento</a>
        </div>
    </object>

</body>
</html>
