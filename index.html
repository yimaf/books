<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Documento</title>
    <style>
        /* Ajusta el diseño para ocupar toda la pantalla limpiamente */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #525659; /* Color gris estándar de los lectores de PDF */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Cambia "tu-archivo.pdf" por el nombre exacto de tu archivo PDF -->
    <iframe src="./Libro%20Patrones%20Dise%C3%B1o%20Estructurales%20GitHub.pdf"></iframe>

</body>
</html>
