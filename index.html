<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de PDFs en Paralelo</title>
    <style>
        /* Configura la pantalla completa y alinea los elementos de lado a lado */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: row; /* Alineación horizontal (Izquierda a Derecha) */
            background-color: #525659;
        }
        /* Cada iframe ocupará exactamente la mitad del ancho de la pantalla */
        iframe {
            width: 50%;
            height: 100%; 
            border: none;
        }
        /* Línea divisoria vertical entre ambos PDFs */
        .divisor {
            width: 4px;
            height: 100%;
            background-color: #333;
        }
    </style>
</head>
<body>

    <!-- PDF de la Izquierda - Cambia "documento1.pdf" por tu archivo -->
    <iframe src="Libro%20Patrones%20Dise%C3%B1o%20Estructurales%20GitHub.pdf"></iframe>

    <!-- Línea divisoria en medio -->
    <div class="divisor"></div>

    <!-- PDF de la Derecha - Cambia "documento2.pdf" por tu archivo -->
    <iframe src="Libro%20de%20Inteligencia%20Artificial%20-Transfromers-GitHub.pdf"></iframe>

</body>
</html>
